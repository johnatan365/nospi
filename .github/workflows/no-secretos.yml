name: Sin secretos en el repo

# Este repositorio es PUBLICO. Si un secreto entra al historial queda expuesto
# para siempre, aunque despues se borre del archivo. El hook local
# (.githooks/pre-commit) es la primera barrera; esta es la segunda, por si
# alguien comitea con --no-verify o sin el hook instalado. Ver CLAUDE.md.
#
# Revisa SOLO lo que trae el push o el PR, no el arbol entero: lo que ya estaba
# comiteado antes no se arregla borrandolo del archivo (sigue en el historial),
# se arregla rotando la llave. Lo que este chequeo cuida es que no entre una
# nueva.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar secretos en lo que se esta subiendo
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -u
          # En el primer push de una rama, github.event.before son puros ceros.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse "$HEAD_SHA^" 2>/dev/null || echo "$HEAD_SHA")
          fi

          agregado=$(git diff --no-color -U0 "$BASE" "$HEAD_SHA" \
                       -- . ':(exclude).githooks/pre-commit' ':(exclude)CLAUDE.md' \
                          ':(exclude).github/workflows/no-secretos.yml' \
                     | grep '^+' | grep -v '^+++' || true)

          fallo=0
          revisar() {
            hits=$(printf '%s\n' "$agregado" | grep -E "$2" | head -3 || true)
            if [ -n "$hits" ]; then
              fallo=1
              echo "::error::$1 en texto plano"
            fi
          }

          revisar "Llave privada de Wompi"       'prv_(prod|test)_[A-Za-z0-9]{10,}'
          revisar "Llave de Resend"              're_[A-Za-z0-9]{20,}'
          revisar "JWT service_role de Supabase" '"role" *: *"service_role"'
          revisar "Secreto de webhook propio"    'nospi_[a-z]+_wh[_a-z]*_[A-Za-z0-9]{6,}'
          revisar "Token de GitHub"              'gh[pousr]_[A-Za-z0-9]{20,}'
          revisar "Llave de Google"              'AIza[0-9A-Za-z_-]{30,}'
          revisar "Llave de OpenAI/Anthropic"    'sk-(ant-)?[A-Za-z0-9-]{20,}'

          if [ "$fallo" -eq 1 ]; then
            echo ""
            echo "Saca el secreto del archivo y leelo de una variable de entorno:"
            echo "  const X = Deno.env.get('X') || '';   // sin valor por defecto"
            echo "El valor va en Supabase > Project Settings > Edge Functions > Secrets."
            exit 1
          fi
          echo "Sin secretos nuevos."
